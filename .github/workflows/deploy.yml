name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Build first: astro-icon writes the `virtual:astro-icon` module
      # declaration (the Icon name union) to .astro/icon.d.ts during the build,
      # and .astro/ is gitignored. `astro sync` does not emit it, so running
      # `astro check` on a clean checkout before a build fails with
      # "Cannot find module 'virtual:astro-icon'". Type check still gates the
      # deploy, since the upload step below only runs if it passes.
      - name: Build
        env:
          # Project site lives at https://<owner>.github.io/<repo>/. Taking the
          # base from the repo name keeps it exact, casing included.
          # Using a custom domain? Set SITE_URL to it and BASE_PATH to "/".
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Type check
        run: npm run check

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
